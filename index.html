<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Copperleaf Trade Counter</title>
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;color:#1c1c1c}
header{display:flex;align-items:center;gap:24px;padding:14px 28px;background:#14342b;color:#fff}
.brand{font-weight:700;font-size:20px}
#region-btn{background:#fff2;border:1px solid #ffffff66;color:#fff;padding:8px 12px;border-radius:6px;cursor:pointer}
main{padding:28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{border:1px solid #ddd;border-radius:10px;padding:16px}
.card h3{margin:0 0 6px;font-size:16px}
.price{font-size:18px;font-weight:700;color:#0b5d3b}
.vendor{color:#666;font-size:13px}
#region-modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50}
#region-panel{background:#fff;border-radius:12px;padding:22px;width:320px}
#country{width:100%;padding:8px;margin:10px 0}
#postal{width:100%;padding:8px;margin:6px 0}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
#suggestions{font-size:12px;color:#777;min-height:16px}
#splash{position:fixed;inset:0;background:#ffffffcc;display:flex;align-items:center;justify-content:center;z-index:99;font-size:14px;color:#333}
</style></head>
<body>
<div id="splash">Loading delivery options…</div>
<header>
  <div class="brand">Copperleaf Trade Counter</div>
  <button id="region-btn" data-region="nl">Deliver to Netherlands ▾</button>
  <div style="margin-left:auto;font-size:13px;opacity:.8">Trade prices shown for your delivery country</div>
</header>
<main>
  <div class="card"><h3>Kestrel Hand Grinder K2</h3><div class="vendor">Kestrel Metalworks</div>
    <div class="price" data-eur="63.38"></div><a href="#">View item</a></div>
  <div class="card"><h3>Noma Ceramic Dripper</h3><div class="vendor">Noma Ceramics</div>
    <div class="price" data-eur="41.20"></div><a href="#">View item</a></div>
  <div class="card"><h3>Cinder Pour-Over Kettle 0.9L</h3><div class="vendor">Cinder House</div>
    <div class="price" data-eur="118.75"></div><a href="#">View item</a></div>
</main>
<div id="region-modal" role="dialog" aria-modal="true">
  <div id="region-panel">
    <h3>Choose delivery country</h3>
    <label for="country">Country / region</label>
    <select id="country">
      <option value="nl">Netherlands</option>
      <option value="de">Germany</option>
      <option value="fr">France</option>
      <option value="au">Australia</option>
      <option value="us">United States</option>
      <option value="jp">Japan</option>
    </select>
    <label for="postal">Postal code (optional — filters address suggestions)</label>
    <input id="postal" placeholder="e.g. 1011 AB">
    <div id="suggestions"></div>
    <div class="row"><button id="cancel">Cancel</button><button id="continue">Continue</button></div>
  </div>
</div>
<script>
(function(){
  var FX = {nl:0.61, de:0.61, fr:0.61, au:1.0, us:0.66, jp:163.0};
  var RATE = {nl:1.0, de:1.0, fr:1.0, au:1.5873, us:1.51, jp:0.0098};
  var LABEL = {nl:'Netherlands', de:'Germany', fr:'France', au:'Australia', us:'United States', jp:'Japan'};
  var SYM = {nl:'€', de:'€', fr:'€', au:'A$', us:'US$', jp:'¥'};
  function cookie(name){
    var m = document.cookie.match(new RegExp('(?:^|; )'+name+'=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }
  var region = cookie('region') || 'nl';
  function fmt(n, region){ return SYM[region]+' '+n.toFixed(2); }
  function render(){
    document.querySelectorAll('.price').forEach(function(el){
      var eur = parseFloat(el.dataset.eur);
      el.textContent = fmt(eur*RATE[region], region);
    });
    var btn = document.getElementById('region-btn');
    btn.textContent = 'Deliver to '+LABEL[region]+' ▾';
    btn.dataset.region = region;
  }
  var splash = document.getElementById('splash');
  var firstClickDone = false;
  setTimeout(function(){ splash.remove(); }, 1200);
  document.getElementById('region-btn').addEventListener('click', function(){
    if (!firstClickDone){ firstClickDone = true; return; }  // first click swallowed once
    document.getElementById('region-modal').style.display='flex';
  });
  document.getElementById('cancel').addEventListener('click', function(){
    document.getElementById('region-modal').style.display='none';
  });
  document.getElementById('postal').addEventListener('keydown', function(e){
    if (e.key === 'Enter'){
      e.preventDefault();
      var v = e.target.value.trim();
      document.getElementById('suggestions').textContent = v ? ('Address suggestions for '+v+' (filter only)') : '';
    }
  });
  document.getElementById('continue').addEventListener('click', function(){
    var c = document.getElementById('country').value;
    document.cookie = 'region='+c+'; path=/; max-age=86400';
    location.reload();
  });
  render();
})();
</script>
</body></html>
